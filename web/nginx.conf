# Nginx reverse proxy — 將 /api/* 轉發至 elk-analyser FastAPI

server {
    listen 80;
    server_name _;

    # 靜態前端
    location / {
        root   /usr/share/nginx/html;
        index  index.html;
        try_files $uri $uri/ /index.html;
    }

    # API proxy → elk-analyser container
    # bob run 逾時上限 = bob_bridge.timeout(120) + 10s buffer = 130s
    # proxy_read_timeout 設為 180s（130s + 50s 安全邊界），與 config.yaml bob_bridge.timeout 保持對應
    location /api/ {
        proxy_pass             http://elk-analyser:8080/;
        proxy_http_version     1.1;
        proxy_set_header       Host $host;
        proxy_set_header       X-Real-IP $remote_addr;
        proxy_set_header       X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout     180s;
        proxy_connect_timeout  10s;
        proxy_send_timeout     60s;
    }
}
