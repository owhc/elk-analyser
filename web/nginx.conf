# Nginx reverse proxy — 統一 Gateway 入口：
# / → 自動導向至 /grafana/
# /grafana/ → 轉發至 Grafana (含 WebSocket 支援)
# /web/ → 保留原 Web UI 作為備用與解說
# /api/ → 轉發至 elk-analyser FastAPI

server {
    listen 80;
    server_name _;

    # 根路徑預設導向 Grafana 統一監控與診斷平台（保持請求 host 與 port，避免 port 丟失）
    location = / {
        return 302 $scheme://$http_host/grafana/;
    }

    # 原 Web UI 靜態前端（備用與架構解說用）
    location /web/ {
        alias  /usr/share/nginx/html/;
        index  index.html;
        try_files $uri $uri/ /web/index.html;
    }

    # 僅針對 jobs 與 analyse 代理至 elk-analyser，切勿攔截 Grafana 本身的 /grafana/api/
    location ~ ^/grafana/api/(jobs|analyse|demo)(.*)$ {
        proxy_pass             http://elk-analyser:8080/$1$2$is_args$args;
        proxy_http_version     1.1;
        proxy_set_header       Host $host;
        proxy_set_header       X-Real-IP $remote_addr;
        proxy_set_header       X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout     180s;
        proxy_connect_timeout  10s;
        proxy_send_timeout     60s;
    }

    # Grafana 代理（含 WebSocket Upgrade 支援）
    location /grafana/ {
        proxy_pass             http://grafana:3000;
        proxy_http_version     1.1;
        proxy_set_header       Host $host;
        proxy_set_header       X-Real-IP $remote_addr;
        proxy_set_header       X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header       X-Forwarded-Proto $scheme;
        proxy_set_header       Upgrade $http_upgrade;
        proxy_set_header       Connection "upgrade";
        proxy_read_timeout     180s;
        proxy_connect_timeout  10s;
        proxy_send_timeout     60s;
    }

    # API proxy → elk-analyser container
    # bob run 逾時上限 = bob_bridge.timeout(120) + 10s buffer = 130s
    # proxy_read_timeout 設為 180s（130s + 50s 安全邊界），與 config.yaml bob_bridge.timeout 保持對應
    location /api/ {
        proxy_pass             http://elk-analyser:8080/;
        proxy_http_version     1.1;
        proxy_set_header       Host $host;
        proxy_set_header       X-Real-IP $remote_addr;
        proxy_set_header       X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout     180s;
        proxy_connect_timeout  10s;
        proxy_send_timeout     60s;
    }
}
