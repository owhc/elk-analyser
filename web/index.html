<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="updated" content="2026-08-27 16:27:40 +0800">
<title>ELK Analyser — Dashboard</title>
<style>
/* ── Reset ──────────────────────────────────────────────────────── */
*{margin:0;padding:0;box-sizing:border-box;}

/* ── Design Tokens ──────────────────────────────────────────────── */
:root{
  /* Surface */
  --navy:        #1a2a3a;
  --navy-mid:    #202f41;
  --navy-lt:     #273d54;
  --navy-glass:  rgba(26,42,58,.72);

  /* Brand */
  --morandi:     #7a9bb5;
  --morandi-l:   #a4bfcf;
  --morandi-dim: rgba(122,155,181,.18);

  /* Text */
  --text:        #dce8f0;
  --text-muted:  rgba(200,218,230,.72);   /* ↑ from .55 — WCAG AA fix */
  --text-dim:    rgba(200,218,230,.45);

  /* Semantic colours */
  --critical: #fb7185;
  --high:     #fbbf24;
  --ok:       #34d399;
  --info:     #7a9bb5;

  /* Derived badge surfaces (avoids raw rgba repetition) */
  --ok-bg:       rgba(52,211,153,.13);
  --ok-border:   rgba(52,211,153,.28);
  --warn-bg:     rgba(251,191,36,.11);
  --warn-border: rgba(251,191,36,.24);
  --err-bg:      rgba(251,113,133,.11);
  --err-border:  rgba(251,113,133,.24);
  --idle-bg:     rgba(200,218,230,.07);
  --idle-border: rgba(200,218,230,.14);

  /* Surface layers */
  --surface:     rgba(255,255,255,.03);
  --surface-mid: rgba(255,255,255,.05);
  --surface-act: rgba(122,155,181,.09);

  /* Borders */
  --border:      rgba(122,155,181,.16);
  --border-act:  rgba(122,155,181,.38);

  /* Spacing scale (4px base) */
  --sp-1: 4px;
  --sp-2: 8px;
  --sp-3: 12px;
  --sp-4: 16px;
  --sp-5: 20px;
  --sp-6: 24px;
  --sp-8: 32px;

  /* Type scale */
  --text-2xs: .6rem;
  --text-xs:  .7rem;
  --text-sm:  .8rem;
  --text-md:  .9rem;
  --text-base: 1rem;
  --text-lg:  1.2rem;
  --text-display: 1.9rem;

  /* Misc */
  --radius:  6px;
  --radius-sm: 3px;
  --font: 'Space Grotesk',system-ui,sans-serif;

  /* Transitions */
  --t-fast: .13s ease;
  --t-mid:  .22s ease;
}

/* ── Base ───────────────────────────────────────────────────────── */
@font-face {
  /* Self-host fallback instruction: place SpaceGrotesk-Variable.woff2 in /web/fonts/
     If unavailable, system-ui takes over gracefully. */
  font-family: 'Space Grotesk';
  src: local('Space Grotesk');
  font-display: optional;
}
html,body{height:100%;background:var(--navy);color:var(--text);font-family:var(--font);font-size:15px;line-height:1.6;}

/* ── Global focus (WCAG fix) ────────────────────────────────────── */
:focus-visible{
  outline: 2px solid var(--morandi);
  outline-offset: 2px;
  border-radius: var(--radius-sm);
}

/* ── Reduced motion ─────────────────────────────────────────────── */
@media (prefers-reduced-motion: reduce) {
  .health-dot,.spin { animation: none !important; }
  *{ transition-duration: .01ms !important; }
}

/* ── Subtle grid texture ────────────────────────────────────────── */
body::before{
  content:'';position:fixed;inset:0;z-index:0;pointer-events:none;
  background-image:linear-gradient(rgba(122,155,181,.055) 1px,transparent 1px),
                   linear-gradient(90deg,rgba(122,155,181,.055) 1px,transparent 1px);
  background-size:44px 44px;
}
#root{position:relative;z-index:1;min-height:100vh;display:flex;flex-direction:column;}

/* ── Topbar ─────────────────────────────────────────────────────── */
.topbar{
  display:flex;align-items:center;justify-content:space-between;
  padding:0 clamp(var(--sp-6),3vw,var(--sp-8));height:56px;
  border-bottom:1px solid var(--border);
  background:var(--navy-glass);backdrop-filter:blur(10px);
  position:sticky;top:0;z-index:100;
}
.brand{display:flex;align-items:center;gap:var(--sp-3);}
.brand-box{
  width:30px;height:30px;background:var(--morandi);flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
}
.brand-box span{font-size:var(--text-2xs);font-weight:800;color:var(--navy);letter-spacing:.02em;}
.brand-name{font-size:var(--text-xs);font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--morandi-l);}
.brand-sub{font-size:var(--text-2xs);color:var(--text-dim);letter-spacing:.04em;}
.topbar-right{display:flex;align-items:center;gap:var(--sp-4);}

.tag-pill{
  font-size:var(--text-2xs);font-weight:600;letter-spacing:.08em;text-transform:uppercase;
  color:var(--text-muted);background:var(--idle-bg);
  border:1px solid var(--border);padding:3px var(--sp-2);border-radius:var(--radius-sm);
  white-space:nowrap;
}
.health-badge{display:flex;align-items:center;gap:var(--sp-1);}
.health-dot{
  width:7px;height:7px;border-radius:50%;background:var(--text-dim);
  animation:blink 2.2s ease-in-out infinite;
}
.health-dot.ok {background:var(--ok);}
.health-dot.err{background:var(--critical);animation:none;}
#api-status-text{font-size:var(--text-xs);font-weight:600;color:var(--text-dim);}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}

/* ── Hide tag-pill on small screens ─────────────────────────────── */
@media(max-width:480px){.tag-pill{display:none;}}

/* ── Layout ─────────────────────────────────────────────────────── */
.main{flex:1;padding:clamp(var(--sp-5),2.5vw,var(--sp-8)) clamp(var(--sp-6),3vw,var(--sp-8));}

.page-title{font-size:var(--text-lg);font-weight:700;color:var(--text);letter-spacing:-.02em;margin-bottom:var(--sp-1);}
.page-sub{font-size:var(--text-xs);color:var(--text-muted);margin-bottom:var(--sp-6);}

/* ── KPI row ────────────────────────────────────────────────────── */
.kpi-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:var(--sp-3);margin-bottom:var(--sp-5);}
.kpi-card{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
  padding:var(--sp-4) var(--sp-4) var(--sp-3);
  display:flex;flex-direction:column;gap:var(--sp-1);
  transition:border-color var(--t-fast);
}
.kpi-card:hover{border-color:var(--border-act);}
.kpi-label{font-size:var(--text-2xs);font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--text-muted);}
.kpi-value{font-size:var(--text-display);font-weight:700;line-height:1;color:var(--text);}
.kpi-value .unit{font-size:var(--text-sm);font-weight:400;color:var(--morandi);margin-left:var(--sp-1);}
.kpi-sub{font-size:var(--text-2xs);color:var(--text-dim);}
.kpi-card.accent-ok   .kpi-value{color:var(--ok);}
.kpi-card.accent-warn .kpi-value{color:var(--high);}
.kpi-card.accent-err  .kpi-value{color:var(--critical);}

/* ── Section header ─────────────────────────────────────────────── */
.section-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:var(--sp-3);}
.section-title{font-size:var(--text-2xs);font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--morandi-l);}
.section-divider{height:1px;background:var(--border);flex:1;margin-left:var(--sp-3);}
.section-action{
  font-size:var(--text-2xs);color:var(--morandi);background:none;border:none;cursor:pointer;
  letter-spacing:.04em;padding:0 var(--sp-2);opacity:.8;font-family:var(--font);
  transition:opacity var(--t-fast);
}
.section-action:hover{opacity:1;text-decoration:underline;}

/* ── Two-column grid ─────────────────────────────────────────────── */
.grid-2{display:grid;grid-template-columns:5fr 7fr;gap:var(--sp-4);margin-bottom:var(--sp-5);}
@media(max-width:900px){.grid-2{grid-template-columns:1fr;}}

/* ── Card ───────────────────────────────────────────────────────── */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;}
.card-head{
  display:flex;align-items:center;justify-content:space-between;
  padding:var(--sp-3) var(--sp-4);border-bottom:1px solid var(--border);
}
.card-head-title{font-size:var(--text-sm);font-weight:600;color:var(--text);display:flex;align-items:center;gap:var(--sp-2);}
.card-icon{width:15px;height:15px;stroke:var(--morandi);fill:none;stroke-width:1.6;flex-shrink:0;}
.card-badge{
  font-size:var(--text-2xs);font-weight:700;letter-spacing:.07em;text-transform:uppercase;
  padding:2px var(--sp-2);border-radius:var(--radius-sm);
}
.badge-ok  {background:var(--ok-bg);  color:var(--ok);  border:1px solid var(--ok-border);}
.badge-warn{background:var(--warn-bg);color:var(--high);border:1px solid var(--warn-border);}
.badge-err {background:var(--err-bg); color:var(--critical);border:1px solid var(--err-border);}
.badge-idle{background:var(--idle-bg);color:var(--text-muted);border:1px solid var(--idle-border);}
.card-body{padding:var(--sp-4);}

/* ── Service list ───────────────────────────────────────────────── */
.svc-list{display:flex;flex-direction:column;gap:var(--sp-2);}
.svc-row{
  display:flex;align-items:center;gap:var(--sp-3);
  padding:var(--sp-2) var(--sp-3);border-radius:var(--radius);
  background:var(--surface-mid);border:1px solid transparent;
  transition:border-color var(--t-fast);
}
.svc-row:hover{border-color:var(--border);}
.svc-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;}
.svc-dot.ok  {background:var(--ok);}
.svc-dot.warn{background:var(--high);}
.svc-dot.err {background:var(--critical);}
.svc-dot.idle{background:var(--text-dim);}
.svc-name{flex:1;font-size:var(--text-sm);font-weight:500;color:var(--text);}
.svc-latency{font-size:var(--text-xs);color:var(--text-muted);min-width:48px;text-align:right;}
.svc-status{font-size:var(--text-2xs);font-weight:700;text-transform:uppercase;letter-spacing:.07em;min-width:52px;text-align:right;}
.svc-status.ok  {color:var(--ok);}
.svc-status.warn{color:var(--high);}
.svc-status.err {color:var(--critical);}
.svc-status.idle{color:var(--text-dim);}

/* ── Form ───────────────────────────────────────────────────────── */
.form-row{display:flex;flex-direction:column;gap:var(--sp-2);margin-bottom:var(--sp-3);}
.form-label{font-size:var(--text-2xs);font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--text-muted);}
.form-input{
  background:var(--surface-mid);border:1px solid var(--border);
  border-radius:var(--radius-sm);padding:var(--sp-2) var(--sp-3);
  color:var(--text);font-size:var(--text-sm);font-family:var(--font);
  outline:none;transition:border-color var(--t-fast);width:100%;
  color-scheme:dark;
}
.form-input:focus{border-color:var(--morandi);}
/* datetime-local calendar icon dark tint */
.form-input::-webkit-calendar-picker-indicator{filter:invert(1) opacity(.6);cursor:pointer;}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:var(--sp-3);}
@media(max-width:640px){.form-grid{grid-template-columns:1fr;}}

/* Buttons */
.btn-primary{
  width:100%;padding:var(--sp-2) var(--sp-3);border-radius:var(--radius-sm);border:none;cursor:pointer;
  background:var(--morandi);color:var(--navy);font-size:var(--text-sm);font-weight:700;
  font-family:var(--font);letter-spacing:.04em;transition:opacity var(--t-fast);
}
.btn-primary:hover{opacity:.85;}
.btn-primary:disabled{opacity:.38;cursor:not-allowed;}
.btn-primary.is-loading::after{content:' …';}

.btn-secondary{
  width:100%;padding:var(--sp-2) var(--sp-3);border-radius:var(--radius-sm);cursor:pointer;
  background:var(--navy-lt);border:1px solid var(--morandi-dim);
  color:var(--morandi-l);font-size:var(--text-sm);font-weight:600;
  font-family:var(--font);letter-spacing:.04em;transition:opacity var(--t-fast);
}
.btn-secondary:hover{opacity:.85;}
.btn-secondary:disabled{opacity:.38;cursor:not-allowed;}

.btn-group{display:flex;gap:var(--sp-2);flex-wrap:wrap;}
.btn-group .btn-primary,.btn-group .btn-secondary{flex:1;min-width:120px;}

.form-feedback{font-size:var(--text-xs);margin-top:var(--sp-2);min-height:var(--sp-4);}
.form-feedback.ok {color:var(--ok);}
.form-feedback.err{color:var(--critical);}

/* ── Jobs table ─────────────────────────────────────────────────── */
.jobs-list{display:flex;flex-direction:column;gap:3px;max-height:320px;overflow-y:auto;}
.jobs-list::-webkit-scrollbar{width:3px;}
.jobs-list::-webkit-scrollbar-track{background:transparent;}
.jobs-list::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px;}

/* Explicit header row — not a data row */
.job-header{
  display:grid;grid-template-columns:20px 28px 1fr auto auto;gap:var(--sp-2);
  padding:var(--sp-1) var(--sp-3);
  border-bottom:1px solid var(--border);margin-bottom:var(--sp-1);
}
.job-header-cell{font-size:var(--text-2xs);font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--text-muted);}

.job-row{
  display:grid;grid-template-columns:20px 28px 1fr auto auto;gap:var(--sp-2);align-items:center;
  padding:var(--sp-2) var(--sp-3);border-radius:var(--radius-sm);background:var(--surface-mid);
  border:1px solid transparent;cursor:pointer;
  transition:border-color var(--t-fast),background var(--t-fast);
}
.job-row:hover{border-color:var(--border);background:var(--surface-act);}
.job-row.selected{background:rgba(91,155,213,.1);border-color:var(--morandi);}
/* accessible: keyboard */
.job-row:focus-visible{outline:2px solid var(--morandi);outline-offset:1px;}

.job-cb{display:flex;align-items:center;justify-content:center;}
.job-cb input[type=checkbox]{width:13px;height:13px;accent-color:var(--morandi);cursor:pointer;}
.job-id{font-size:var(--text-xs);color:var(--text-muted);font-weight:600;}
.job-window{font-size:var(--text-xs);color:var(--text);}
.job-window span{color:var(--text-muted);font-size:var(--text-2xs);display:block;}
.job-status{font-size:var(--text-2xs);font-weight:700;text-transform:uppercase;letter-spacing:.06em;}
.job-status.completed{color:var(--ok);}
.job-status.failed   {color:var(--critical);}
.job-status.running  {color:var(--high);}
.job-report{font-size:var(--text-xs);color:var(--morandi);text-decoration:none;white-space:nowrap;}
.job-report:hover{text-decoration:underline;}
.jobs-empty{
  text-align:center;padding:var(--sp-8) 0;font-size:var(--text-sm);color:var(--text-muted);
  display:flex;flex-direction:column;align-items:center;gap:var(--sp-3);
}
.jobs-empty-icon{opacity:.35;}

/* Toolbar */
.jobs-toolbar{
  display:none;align-items:center;gap:var(--sp-2);
  padding:var(--sp-2) var(--sp-3);margin-bottom:var(--sp-2);
  background:rgba(91,155,213,.07);border:1px solid var(--morandi-dim);border-radius:var(--radius-sm);
}
.jobs-toolbar.visible{display:flex;}
.jobs-toolbar-count{font-size:var(--text-xs);color:var(--morandi);font-weight:600;flex:1;}
.btn-delete-sel{
  padding:4px var(--sp-3);background:transparent;border:1px solid var(--err-border);
  color:var(--critical);border-radius:var(--radius-sm);font-size:var(--text-xs);font-weight:700;
  cursor:pointer;font-family:var(--font);transition:background var(--t-fast);
}
.btn-delete-sel:hover{background:var(--err-bg);}
.btn-cancel-sel{
  padding:4px var(--sp-2);background:transparent;border:1px solid var(--border);
  color:var(--text-muted);border-radius:var(--radius-sm);font-size:var(--text-xs);
  cursor:pointer;font-family:var(--font);transition:opacity var(--t-fast);
}
.btn-cancel-sel:hover{opacity:.7;}

/* ── Detail panel (slide-in) ────────────────────────────────────── */
.detail-overlay{
  position:fixed;inset:0;z-index:200;background:rgba(10,18,28,.65);
  backdrop-filter:blur(3px);
  /* Use visibility + opacity for CSS-transition-able open/close */
  visibility:hidden;opacity:0;
  display:flex;align-items:flex-end;justify-content:flex-end;
  transition:opacity var(--t-mid),visibility var(--t-mid);
}
.detail-overlay.open{visibility:visible;opacity:1;}
.detail-panel{
  width:min(500px,100vw);height:100dvh;background:var(--navy-mid);
  border-left:1px solid var(--border);overflow-y:auto;display:flex;flex-direction:column;
  transform:translateX(100%);
  transition:transform .25s cubic-bezier(.4,0,.2,1);
}
.detail-overlay.open .detail-panel{transform:translateX(0);}
.detail-head{
  display:flex;align-items:center;justify-content:space-between;
  padding:var(--sp-4) var(--sp-5);border-bottom:1px solid var(--border);
  position:sticky;top:0;background:var(--navy-mid);z-index:10;
}
.detail-title{font-size:var(--text-md);font-weight:700;color:var(--text);}
.btn-close{
  background:none;border:none;cursor:pointer;color:var(--text-muted);
  width:28px;height:28px;display:flex;align-items:center;justify-content:center;
  border-radius:var(--radius-sm);transition:background var(--t-fast);
  font-size:1rem;font-family:var(--font);
}
.btn-close:hover{background:var(--surface-mid);}
.detail-body{padding:var(--sp-4) var(--sp-5);flex:1;}
.detail-section{margin-bottom:var(--sp-5);}
.detail-section-title{
  font-size:var(--text-2xs);font-weight:700;letter-spacing:.12em;text-transform:uppercase;
  color:var(--morandi);margin-bottom:var(--sp-3);
}
.detail-kv{display:flex;flex-direction:column;gap:var(--sp-2);}
.detail-row{display:flex;gap:var(--sp-3);font-size:var(--text-sm);}
.detail-key{color:var(--text-muted);min-width:88px;flex-shrink:0;}
.detail-val{color:var(--text);word-break:break-all;}
.chain-card{
  background:var(--surface-mid);border:1px solid var(--border);
  border-radius:var(--radius);padding:var(--sp-3) var(--sp-4);margin-bottom:var(--sp-3);
}
.chain-sev{font-size:var(--text-2xs);font-weight:700;letter-spacing:.08em;text-transform:uppercase;margin-bottom:var(--sp-1);}
.chain-sev.CRITICAL{color:var(--critical);}
.chain-sev.HIGH    {color:var(--high);}
.chain-sev.MEDIUM  {color:var(--morandi-l);}
.chain-title{font-size:var(--text-sm);font-weight:600;color:var(--text);margin-bottom:var(--sp-2);}
.chain-rc{font-size:var(--text-xs);color:var(--text-muted);line-height:1.6;}
.chain-fix-title{font-size:var(--text-2xs);font-weight:700;color:var(--morandi);margin:var(--sp-3) 0 var(--sp-1);}
.chain-fix{font-size:var(--text-xs);color:var(--text-muted);line-height:1.6;}

/* ── Footer ─────────────────────────────────────────────────────── */
.footer{
  padding:var(--sp-3) clamp(var(--sp-6),3vw,var(--sp-8));border-top:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-between;
  font-size:var(--text-2xs);color:var(--text-muted);
}
.footer-refresh{
  font-size:var(--text-2xs);color:var(--morandi);cursor:pointer;
  background:none;border:none;font-family:var(--font);
  transition:opacity var(--t-fast);
}
.footer-refresh:hover{opacity:.7;text-decoration:underline;}

/* ── Spinner ────────────────────────────────────────────────────── */
.spin{
  display:inline-block;width:12px;height:12px;
  border:2px solid var(--border);border-top-color:var(--morandi);
  border-radius:50%;animation:spin .75s linear infinite;vertical-align:middle;
}
@keyframes spin{to{transform:rotate(360deg)}}

/* ── Countdown ring ─────────────────────────────────────────────── */
#refresh-countdown{
  font-size:var(--text-2xs);color:var(--text-muted);letter-spacing:.04em;
  font-variant-numeric:tabular-nums;
}
</style>
</head>

<body>
<div id="root">

<!-- ── Topbar ─────────────────────────────────────────────────── -->
<header class="topbar">
  <div class="brand">
    <div class="brand-box"><span>ELK</span></div>
    <div>
      <div class="brand-name">ELK Analyser</div>
      <div class="brand-sub">Log Analysis &amp; Diagnostic Platform</div>
    </div>
  </div>
  <div class="topbar-right">
    <div class="health-badge">
      <div class="health-dot" id="api-dot"></div>
      <span id="api-status-text">連線中…</span>
    </div>
    <div class="tag-pill" id="last-refresh" aria-label="最後更新時間">—</div>
    <div class="tag-pill" id="refresh-countdown" aria-live="polite" aria-label="下次更新倒數">—s</div>
  </div>
</header>

<!-- ── Main ───────────────────────────────────────────────────── -->
<main class="main">
  <div class="page-title">監控總覽</div>
  <div class="page-sub" id="page-sub" aria-live="polite">正在載入系統狀態…</div>

  <!-- KPI row -->
  <div class="kpi-row" role="region" aria-label="關鍵指標">
    <div class="kpi-card" id="kpi-total">
      <div class="kpi-label">分析任務總數</div>
      <div class="kpi-value" aria-label="載入中"><span class="spin" aria-hidden="true"></span></div>
      <div class="kpi-sub">累計歷史紀錄</div>
    </div>
    <div class="kpi-card accent-err" id="kpi-failed">
      <div class="kpi-label">失敗任務</div>
      <div class="kpi-value" aria-label="載入中"><span class="spin" aria-hidden="true"></span></div>
      <div class="kpi-sub">需要關注</div>
    </div>
    <div class="kpi-card accent-ok" id="kpi-completed">
      <div class="kpi-label">成功完成</div>
      <div class="kpi-value" aria-label="載入中"><span class="spin" aria-hidden="true"></span></div>
      <div class="kpi-sub">診斷報告已產出</div>
    </div>
    <div class="kpi-card" id="kpi-running">
      <div class="kpi-label">執行中</div>
      <div class="kpi-value" aria-label="載入中"><span class="spin" aria-hidden="true"></span></div>
      <div class="kpi-sub">分析任務</div>
    </div>
  </div>

  <!-- Row 1: Service Health + Analyse (5:7 split) -->
  <div class="grid-2">

    <!-- Service Health card -->
    <div class="card">
      <div class="card-head">
        <div class="card-head-title">
          <svg class="card-icon" viewBox="0 0 24 24" aria-hidden="true"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
          服務健康狀態
        </div>
        <span class="card-badge badge-idle" id="health-badge">檢查中</span>
      </div>
      <div class="card-body">
        <div class="svc-list" id="svc-list" role="list">
          <div class="svc-row" role="listitem">
            <span class="spin" aria-hidden="true"></span>
            <span style="font-size:var(--text-sm);color:var(--text-muted);margin-left:var(--sp-2);">載入中…</span>
          </div>
        </div>
      </div>
    </div>

    <!-- Analyse form card -->
    <div class="card">
      <div class="card-head">
        <div class="card-head-title">
          <svg class="card-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          觸發主動分析
        </div>
        <span class="card-badge badge-idle">On-Demand</span>
      </div>
      <div class="card-body">
        <div class="form-grid">
          <div class="form-row">
            <label class="form-label" for="from-time">開始時間</label>
            <input class="form-input" type="datetime-local" id="from-time">
          </div>
          <div class="form-row">
            <label class="form-label" for="to-time">結束時間</label>
            <input class="form-input" type="datetime-local" id="to-time">
          </div>
        </div>
        <div class="btn-group">
          <button class="btn-primary" id="btn-analyse" onclick="triggerAnalyse()">▶ 立即分析</button>
          <button class="btn-secondary" id="btn-demo" onclick="injectDemo()">注入 Demo 資料</button>
        </div>
        <div class="form-feedback" id="analyse-feedback" role="status" aria-live="polite"></div>
      </div>
    </div>

  </div>

  <!-- Row 2: Jobs history (full width) -->
  <div class="card">
    <div class="card-head">
      <div class="card-head-title">
        <svg class="card-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
        分析任務歷史
      </div>
      <button class="section-action" onclick="loadJobs()" aria-label="重新整理任務列表">↺ 重新整理</button>
    </div>
    <div class="card-body" style="padding:var(--sp-3) var(--sp-4);">

      <!-- Delete toolbar (visible when rows selected) -->
      <div class="jobs-toolbar" id="jobs-toolbar" role="toolbar" aria-label="批量操作">
        <span class="jobs-toolbar-count" id="jobs-sel-count" aria-live="polite">已選 0 筆</span>
        <button class="btn-cancel-sel" onclick="clearSelection()">取消</button>
        <button class="btn-delete-sel" onclick="deleteSelected()">刪除所選</button>
      </div>

      <!-- Column headers — proper header row, not a data row -->
      <div class="job-header" role="row">
        <div class="job-cb"><input type="checkbox" id="cb-all" title="全選" onclick="toggleSelectAll(this)" aria-label="全選所有任務"></div>
        <div class="job-header-cell" role="columnheader">#</div>
        <div class="job-header-cell" role="columnheader">查詢視窗</div>
        <div class="job-header-cell" role="columnheader">狀態</div>
        <div class="job-header-cell" role="columnheader">報告</div>
      </div>

      <div class="jobs-list" id="jobs-list" role="list">
        <div class="jobs-empty">
          <svg class="jobs-empty-icon" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2" aria-hidden="true"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
          <span class="spin" aria-hidden="true"></span>
        </div>
      </div>
    </div>
  </div>

</main>

<!-- ── Footer ─────────────────────────────────────────────────── -->
<footer class="footer">
  <span>ELK Analyser · Morandi Blue Tech · <span id="footer-time">—</span></span>
  <button class="footer-refresh" onclick="refreshAll()" aria-label="立即重新整理所有資料">↺ 全部重新整理</button>
</footer>

</div><!-- #root -->

<!-- ── Detail panel ────────────────────────────────────────────── -->
<div class="detail-overlay" id="detail-overlay" onclick="closeDetail(event)" role="dialog" aria-modal="true" aria-labelledby="detail-title">
  <div class="detail-panel" id="detail-panel">
    <div class="detail-head">
      <div class="detail-title" id="detail-title">任務詳情</div>
      <button class="btn-close" onclick="closeDetailPanel()" aria-label="關閉詳情面板">✕</button>
    </div>
    <div class="detail-body" id="detail-body"></div>
  </div>
</div>

<script>
// ── Config ───────────────────────────────────────────────────────
const API = '/api';   // Nginx proxy → elk-analyser:8080
const REFRESH_MS = 30000;

// ── Helpers ──────────────────────────────────────────────────────
const $ = id => document.getElementById(id);

function fmtDt(iso) {
  if (!iso) return '—';
  try { return new Date(iso).toLocaleString('zh-TW', {hour12:false}).replace(',',''); }
  catch { return iso.slice(0,16); }
}

function shortDt(iso) {
  if (!iso) return '—';
  try { return new Date(iso).toLocaleString('zh-TW',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false}); }
  catch { return iso.slice(5,16); }
}

function now8() {
  return new Date().toLocaleString('zh-TW',{hour12:false,timeZone:'Asia/Taipei'}).replace(',','');
}

// ── Refresh countdown ─────────────────────────────────────────────
let _countdownSec = REFRESH_MS / 1000;
let _lastTriggerId = null;
function startCountdown() {
  _countdownSec = REFRESH_MS / 1000;
  clearInterval(_lastTriggerId);
  _lastTriggerId = setInterval(() => {
    _countdownSec--;
    const el = $('refresh-countdown');
    if (el) el.textContent = _countdownSec + 's';
    if (_countdownSec <= 0) {
      refreshAll();
      _countdownSec = REFRESH_MS / 1000;
    }
  }, 1000);
}

// ── Health check ─────────────────────────────────────────────────
async function checkHealth() {
  const dot   = $('api-dot');
  const txt   = $('api-status-text');
  const badge = $('health-badge');
  const list  = $('svc-list');

  const services = [
    { name: 'ELK Analyser API', url: `${API}/health` },
  ];

  let allOk = true;
  const rows = [];

  for (const svc of services) {
    const start = Date.now();
    try {
      const res = await fetch(svc.url, {signal: AbortSignal.timeout(5000)});
      const ms  = Date.now() - start;
      const ok  = res.ok;
      if (!ok) allOk = false;
      rows.push({name: svc.name, status: ok ? 'ok' : 'err', latency: ms});
    } catch(e) {
      allOk = false;
      rows.push({name: svc.name, status: 'err', latency: null});
    }
  }

  dot.className   = 'health-dot ' + (allOk ? 'ok' : 'err');
  txt.textContent = allOk ? 'API 正常' : 'API 異常';
  txt.style.color = allOk ? 'var(--ok)' : 'var(--critical)';

  badge.className   = 'card-badge ' + (allOk ? 'badge-ok' : 'badge-err');
  badge.textContent = allOk ? '全部正常' : '異常偵測';

  list.innerHTML = rows.map(r => `
    <div class="svc-row" role="listitem">
      <div class="svc-dot ${r.status}" aria-hidden="true"></div>
      <div class="svc-name">${r.name}</div>
      <div class="svc-latency">${r.latency !== null ? r.latency + 'ms' : '—'}</div>
      <div class="svc-status ${r.status}">${r.status === 'ok' ? 'Online' : 'Offline'}</div>
    </div>
  `).join('');

  const t = now8();
  $('last-refresh').textContent = t;
  $('footer-time').textContent  = t;
  $('page-sub').textContent = allOk
    ? `系統運行正常 · 最後更新：${t}`
    : `偵測到服務異常，請檢查 elk-analyser container · 最後更新：${t}`;
}

// ── Load jobs ─────────────────────────────────────────────────────
async function loadJobs() {
  const list = $('jobs-list');
  list.innerHTML = `
    <div class="jobs-empty">
      <svg class="jobs-empty-icon" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2" aria-hidden="true"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
      <span class="spin" aria-hidden="true"></span>
    </div>`;
  try {
    const res  = await fetch(`${API}/jobs?limit=20`);
    const jobs = await res.json();
    updateKPI(jobs);
    if (!jobs.length) {
      list.innerHTML = `
        <div class="jobs-empty">
          <svg class="jobs-empty-icon" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2" aria-hidden="true"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
          尚無分析紀錄，請觸發第一次分析
        </div>`;
      return;
    }
    list.innerHTML = jobs.map(j => `
      <div class="job-row" id="row-${j.id}"
           role="button" tabindex="0"
           aria-label="查看任務 #${j.id} 詳情"
           onclick="openDetail(${j.id})"
           onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();openDetail(${j.id});}">
        <div class="job-cb" onclick="event.stopPropagation()" onkeydown="event.stopPropagation()">
          <input type="checkbox" class="job-cb-input" data-id="${j.id}"
                 aria-label="選取任務 #${j.id}"
                 onchange="onRowCheck()">
        </div>
        <div class="job-id">${j.id}</div>
        <div class="job-window">
          ${shortDt(j.query_from)}
          <span>→ ${shortDt(j.query_to)}</span>
        </div>
        <div class="job-status ${j.status}">${j.status}</div>
        <div>${j.report_path
          ? `<a class="job-report" href="/api/jobs/${j.id}/report" download
               title="${j.report_path}"
               aria-label="下載任務 #${j.id} 報告"
               onclick="event.stopPropagation()">↓ 下載</a>`
          : `<span style="color:var(--text-dim);font-size:var(--text-2xs);">—</span>`
        }</div>
      </div>
    `).join('');
  } catch(e) {
    list.innerHTML = `<div class="jobs-empty" style="color:var(--critical);">無法連線至 API，請確認 elk-analyser container 是否運行。</div>`;
    updateKPI([]);
  }
}

// ── KPI update ────────────────────────────────────────────────────
function updateKPI(jobs) {
  const total     = jobs.length;
  const completed = jobs.filter(j => j.status === 'completed').length;
  const failed    = jobs.filter(j => j.status === 'failed').length;
  const running   = jobs.filter(j => j.status === 'running').length;

  const setKpi = (id, val) => {
    const el = $(id).querySelector('.kpi-value');
    el.textContent = val;
    el.removeAttribute('aria-label');
  };
  setKpi('kpi-total',     total);
  setKpi('kpi-completed', completed);
  setKpi('kpi-failed',    failed);
  setKpi('kpi-running',   running);

  $('kpi-failed').className  = 'kpi-card ' + (failed  > 0 ? 'accent-err'  : '');
  $('kpi-running').className = 'kpi-card ' + (running > 0 ? 'accent-warn' : '');
}

// ── Trigger analyse ───────────────────────────────────────────────
async function triggerAnalyse() {
  const fromEl = $('from-time');
  const toEl   = $('to-time');
  const btn    = $('btn-analyse');
  const fb     = $('analyse-feedback');

  if (!fromEl.value || !toEl.value) {
    fb.textContent = '請選擇開始時間與結束時間';
    fb.className   = 'form-feedback err';
    return;
  }
  const fromTime = fromEl.value.replace('T', ' ');
  const toTime   = toEl.value.replace('T', ' ');

  btn.disabled    = true;
  btn.textContent = '分析中…';
  btn.classList.add('is-loading');
  fb.textContent  = '';
  fb.className    = 'form-feedback';

  try {
    const res  = await fetch(`${API}/analyse`, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({from_time: fromTime, to_time: toTime}),
    });
    const data = await res.json();
    if (res.ok && data.status === 'completed') {
      fb.textContent = `分析完成：異常 ${data.summary?.total_errors ?? 0} 筆，CRITICAL ${data.summary?.critical_count ?? 0} 筆`;
      fb.className   = 'form-feedback ok';
      loadJobs();
    } else {
      fb.textContent = `分析失敗：${data.error || data.detail || '未知錯誤'}`;
      fb.className   = 'form-feedback err';
    }
  } catch(e) {
    fb.textContent = '無法連線至 API';
    fb.className   = 'form-feedback err';
  } finally {
    btn.disabled    = false;
    btn.textContent = '▶ 立即分析';
    btn.classList.remove('is-loading');
  }
}

// ── Demo inject ───────────────────────────────────────────────────
async function injectDemo() {
  const btn = $('btn-demo');
  const fb  = $('analyse-feedback');
  btn.disabled    = true;
  btn.textContent = '注入中…';
  fb.textContent  = '';
  fb.className    = 'form-feedback';

  const fromEl = $('from-time');
  const toEl   = $('to-time');
  const fromTime = fromEl.value ? fromEl.value.replace('T',' ') : '2025-01-15 08:00';
  const toTime   = toEl.value   ? toEl.value.replace('T',' ')   : '2025-01-15 09:00';

  try {
    const res  = await fetch(`${API}/demo/inject`, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({from_time: fromTime, to_time: toTime, trigger_analyse: true}),
    });
    const data = await res.json();
    if (res.ok) {
      fb.textContent = 'Demo 資料注入完成，分析已觸發';
      fb.className   = 'form-feedback ok';
      loadJobs();
    } else {
      fb.textContent = `注入失敗：${data.detail || '未知錯誤'}`;
      fb.className   = 'form-feedback err';
    }
  } catch(e) {
    fb.textContent = '無法連線至 API';
    fb.className   = 'form-feedback err';
  } finally {
    btn.disabled    = false;
    btn.textContent = '注入 Demo 資料';
  }
}

// ── Detail panel ──────────────────────────────────────────────────
let _lastFocusedRow = null;

async function openDetail(id) {
  _lastFocusedRow = document.activeElement;
  const overlay = $('detail-overlay');
  const body    = $('detail-body');
  $('detail-title').textContent = `任務 #${id} 詳情`;
  body.innerHTML = `<div style="padding:2rem;text-align:center;"><span class="spin" aria-label="載入中"></span></div>`;
  overlay.classList.add('open');

  // focus trap — focus close btn after open
  requestAnimationFrame(() => {
    const closeBtn = overlay.querySelector('.btn-close');
    if (closeBtn) closeBtn.focus();
  });

  try {
    const res = await fetch(`${API}/jobs/${id}`);
    const j   = await res.json();
    const chains = j.summary?.event_chains || [];
    const s = j.summary || {};

    body.innerHTML = `
      <div class="detail-section">
        <div class="detail-section-title">任務資訊</div>
        <div class="detail-kv">
          <div class="detail-row"><span class="detail-key">ID</span><span class="detail-val">${j.id}</span></div>
          <div class="detail-row"><span class="detail-key">觸發模式</span><span class="detail-val">${j.trigger_mode}</span></div>
          <div class="detail-row"><span class="detail-key">查詢視窗</span><span class="detail-val">${fmtDt(j.query_from)} → ${fmtDt(j.query_to)}</span></div>
          <div class="detail-row"><span class="detail-key">狀態</span><span class="detail-val job-status ${j.status}">${j.status}</span></div>
          <div class="detail-row"><span class="detail-key">開始時間</span><span class="detail-val">${fmtDt(j.started_at)}</span></div>
          <div class="detail-row"><span class="detail-key">完成時間</span><span class="detail-val">${fmtDt(j.completed_at)}</span></div>
          ${j.error ? `<div class="detail-row"><span class="detail-key">錯誤訊息</span><span class="detail-val" style="color:var(--critical)">${j.error}</span></div>` : ''}
        </div>
      </div>

      ${s.total_errors !== undefined ? `
      <div class="detail-section">
        <div class="detail-section-title">分析摘要</div>
        <div class="detail-kv">
          <div class="detail-row"><span class="detail-key">異常總數</span><span class="detail-val">${s.total_errors}</span></div>
          <div class="detail-row"><span class="detail-key">CRITICAL</span><span class="detail-val" style="color:var(--critical)">${s.critical_count}</span></div>
          <div class="detail-row"><span class="detail-key">WARNING</span><span class="detail-val" style="color:var(--high)">${s.warning_count}</span></div>
          <div class="detail-row"><span class="detail-key">受影響模組</span><span class="detail-val">${(s.affected_modules||[]).join(', ') || '—'}</span></div>
        </div>
      </div>` : ''}

      ${j.report_path ? `
      <div class="detail-section">
        <div class="detail-section-title">診斷報告</div>
        <div style="display:flex;align-items:center;gap:var(--sp-3);flex-wrap:wrap;">
          <div style="font-size:var(--text-xs);color:var(--text-muted);word-break:break-all;flex:1;">${j.report_path}</div>
          <a href="/api/jobs/${j.id}/report" download
             style="display:inline-block;padding:var(--sp-2) var(--sp-4);background:var(--morandi);color:var(--navy);border-radius:var(--radius-sm);font-size:var(--text-xs);font-weight:700;text-decoration:none;white-space:nowrap;">
            ↓ 下載 PPTX
          </a>
        </div>
      </div>` : ''}

      ${chains.length ? `
      <div class="detail-section">
        <div class="detail-section-title">根因事件鏈（${chains.length}）</div>
        ${chains.map(c => `
          <div class="chain-card">
            <div class="chain-sev ${c.severity}">${c.severity}</div>
            <div class="chain-title">${c.title || c.chain_id}</div>
            <div class="chain-rc">${c.root_cause || ''}</div>
            ${c.short_term_fix ? `<div class="chain-fix-title">短期處置</div><div class="chain-fix">${c.short_term_fix}</div>` : ''}
            ${c.long_term_fix  ? `<div class="chain-fix-title">長期改善</div><div class="chain-fix">${c.long_term_fix}</div>` : ''}
          </div>
        `).join('')}
      </div>` : ''}
    `;
  } catch(e) {
    body.innerHTML = `<div style="color:var(--critical);font-size:var(--text-sm);padding:1rem;">載入失敗：${e.message}</div>`;
  }
}

function closeDetailPanel() {
  $('detail-overlay').classList.remove('open');
  // return focus to trigger row
  if (_lastFocusedRow && _lastFocusedRow.focus) _lastFocusedRow.focus();
}

function closeDetail(e) {
  if (e.target === $('detail-overlay')) closeDetailPanel();
}

// Trap focus within detail panel
$('detail-overlay').addEventListener('keydown', e => {
  if (e.key === 'Escape') { closeDetailPanel(); return; }
  if (e.key !== 'Tab') return;
  const panel    = $('detail-panel');
  const focusable = [...panel.querySelectorAll('a[href],button,input,[tabindex="0"]')].filter(el => !el.disabled);
  if (!focusable.length) return;
  const first = focusable[0], last = focusable[focusable.length - 1];
  if (e.shiftKey) {
    if (document.activeElement === first) { e.preventDefault(); last.focus(); }
  } else {
    if (document.activeElement === last)  { e.preventDefault(); first.focus(); }
  }
});

// ── Selection helpers ─────────────────────────────────────────────
function getCheckedIds() {
  return [...document.querySelectorAll('.job-cb-input:checked')].map(el => +el.dataset.id);
}

function onRowCheck() {
  const ids    = getCheckedIds();
  const count  = ids.length;
  const total  = document.querySelectorAll('.job-cb-input').length;
  const cbAll  = $('cb-all');
  $('jobs-toolbar').classList.toggle('visible', count > 0);
  $('jobs-sel-count').textContent = `已選 ${count} 筆`;
  cbAll.indeterminate = count > 0 && count < total;
  cbAll.checked = count > 0 && count === total;
  document.querySelectorAll('.job-cb-input').forEach(cb => {
    document.getElementById('row-' + cb.dataset.id)?.classList.toggle('selected', cb.checked);
  });
}

function toggleSelectAll(cbAllEl) {
  document.querySelectorAll('.job-cb-input').forEach(cb => { cb.checked = cbAllEl.checked; });
  onRowCheck();
}

function clearSelection() {
  document.querySelectorAll('.job-cb-input').forEach(cb => { cb.checked = false; });
  const cbAll = $('cb-all');
  if (cbAll) { cbAll.checked = false; cbAll.indeterminate = false; }
  onRowCheck();
}

// ── Delete jobs ───────────────────────────────────────────────────
async function deleteSelected() {
  const ids = getCheckedIds();
  if (!ids.length) return;
  if (!confirm(`確定刪除選取的 ${ids.length} 筆任務？此操作無法復原。`)) return;

  const btn = document.querySelector('.btn-delete-sel');
  btn.disabled    = true;
  btn.textContent = '刪除中…';

  try {
    const res = await fetch(`${API}/jobs`, {
      method: 'DELETE',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ids}),
    });
    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      alert(`刪除失敗：${err.detail || res.statusText}`);
      return;
    }
    clearSelection();
    loadJobs();
  } catch(e) {
    alert('刪除失敗：無法連線至 API');
  } finally {
    btn.disabled    = false;
    btn.textContent = '刪除所選';
  }
}

// ── Init datetime inputs ──────────────────────────────────────────
function initDatetimeInputs() {
  const now  = new Date();
  const from = new Date(now - 3600000);
  const fmt  = d => d.toISOString().slice(0,16);
  $('to-time').value   = fmt(now);
  $('from-time').value = fmt(from);
}

// ── Refresh all ───────────────────────────────────────────────────
async function refreshAll() {
  await Promise.all([checkHealth(), loadJobs()]);
  startCountdown();
}

// ── Boot ──────────────────────────────────────────────────────────
initDatetimeInputs();
refreshAll();
</script>
</body>
</html>
