# podman-compose.override.yml — Instana Java Agent 注入覆寫文件
# ================================================================
# 使用方式（從根目錄執行）：
#   podman-compose -f podman-compose.yml -f podman-compose.override.yml up -d
#
# 無需下載或建立 volume：bootstrap no-op JAR 已隨 repo 放在
# instana-agent-package/instana-javaagent-bootstrap.jar，直接 bind mount。
# 真正的 tracing 由 Instana Host Agent late-attach 注入。
# ================================================================

version: "3.8"

services:
  banking-app:
    volumes:
      - ./instana-agent-package/instana-javaagent-bootstrap.jar:/opt/instana-agent/instana-agent.jar:ro,z
      - ./japp-demo/container-japp/liberty-config/jvm.options:/opt/ibm/wlp/usr/servers/defaultServer/jvm.options:ro,z

    environment:
      # OpenJ9/Semeru：bootstrap no-op JAR 由 supervisord.conf JVM_ARGS 注入
      # standalone-collector 由 Instana Host Agent late-attach 注入，不在此設定
      INSTANA_SERVICE_NAME:  "banking-app-liberty"
      INSTANA_TAGS:          "team=banking,env=staging,container=japp,framework=spring-boot"
