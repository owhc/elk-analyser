# Updated: 2026-09-15 21:41:20 +0800
# ELK Analyser 主設定檔
# 所有連線參數、欄位映射、排程設定均在此集中管理

# ── Elasticsearch 連線設定 ──────────────────────────────────────────
elasticsearch:
  # local = 對接 japp-demo ELK Stack 的真實 Elasticsearch
  # mock  = 使用本機 mock 資料（離線開發用）
  # remote = 對接外部 ES 叢集
  mode: local                       # mock | local | remote
  # japp-network 內的 ES service hostname（podman-compose 服務名稱解析）
  # 本機直連時可改為 localhost
  host: "elasticsearch"
  port: 9200
  scheme: "http"                    # http | https（japp-demo ES 已關閉 xpack.security）
  # 正式環境 TLS 設定（mode: remote 時啟用）
  # ca_cert: "/certs/ca.crt"
  # client_cert: "/certs/client.crt"
  # client_key: "/certs/client.key"
  username: ""
  password: ""                      # Demo 環境 security 已關閉，無需密碼；正式環境設 ES_PASSWORD 環境變數
  index_pattern: "banking-logs-*"   # 對應 japp-demo Logstash 輸出的 index 命名
  timeout: 30                       # 查詢逾時秒數

# ── 欄位映射（對應不同 ELK schema）──────────────────────────────────
field_mapping:
  timestamp: "@timestamp"           # 時間欄位名稱
  level: "log.level"                # 日誌等級欄位
  message: "message"                # 訊息欄位
  service: "service"                # japp-demo Logstash mutate add_field 輸出的欄位名稱
  trace_id: "trace.id"              # Trace ID（用於事件分組）
  host: "host.name"                 # 主機名稱
  # 若欄位不存在則自動 fallback，無需修改程式碼

# ── 日誌過濾設定 ────────────────────────────────────────────────────
filter:
  # 只分析這些等級的日誌（大小寫不敏感）
  levels:
    - ERROR
    - FATAL
    - CRITICAL
  # 額外關鍵字過濾（空陣列表示不過濾）
  keywords: []
  # 每次查詢最多回傳筆數（防止資料量過大）
  max_hits: 5000

# ── Bob CLI 設定（直接在本 container 執行，無需 SSH）────────────────
bob_bridge:
  workspace_path: "/workspace"      # 事件序列 JSON 暫存目錄
  logs_subdir: "logs"               # workspace 下的子目錄
  mode: "log-analyst"               # Bob CLI custom mode slug
  timeout: 120                      # bob run 逾時秒數（F-03：已移除廢棄的 report_timeout）

# ── 報告設定 ────────────────────────────────────────────────────────
report:
  output_dir: "/reports"            # PPTX 輸出目錄
  # 報告檔名格式：report_YYYYMMDD_HHMMSS.pptx
  filename_prefix: "elk_analysis"

# ── Checkpoint 設定 ─────────────────────────────────────────────────
checkpoint:
  # Kibana Alert 不帶時間觸發，且 Checkpoint 為空時的預設回溯分鐘數
  default_lookback_minutes: 60

# ── 持久化設定 ──────────────────────────────────────────────────────
database:
  path: "/db/history.db"            # SQLite 資料庫路徑

# ── REST API 設定 ───────────────────────────────────────────────────
api:
  host: "0.0.0.0"
  port: 8080

# ── Webhook 通知（選用）────────────────────────────────────────────
webhook:
  enabled: false
  url: ""                           # 例：https://hooks.slack.com/...
  # on_complete: true
  # on_error: true

# ── Instana APM 整合（選用）─────────────────────────────────────────
# enabled=true 時，trigger=kibana_alert_instana / webui_instana 路徑
# 將自動向 Instana 查詢同時間窗口的 APM 歷史資料，合併至分析報告。
instana:
  enabled: true                     # true = 啟用 Instana 整合；false = 純 ELK 模式
  base_url: "https://ibmdevsandbox-instanaibm.instana.io"
  api_token: ""                     # 設定 INSTANA_API_TOKEN 環境變數，或直接填入（不建議）
  application_id: "XdhrXfC4QYqm2ixHSlY5dQ"   # banking-app-liberty
  collect_infra_metrics: false      # true = 額外收集 JVM / Artemis metrics（可選）
