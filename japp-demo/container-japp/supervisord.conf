; Updated: 2026-09-17 16:51:48 +0800
[supervisord]
nodaemon=true
logfile=/logs/supervisor.log
logfile_maxbytes=10MB
logfile_backups=3
pidfile=/tmp/supervisord.pid

; ─── ActiveMQ Artemis Broker ───────────────────────────────────────────────
; priority=10：先啟動 MQ，再啟動 Liberty（確保 Liberty MDB 可連線）
[program:artemis]
command=/var/lib/artemis-broker/bin/artemis run
autostart=true
autorestart=true
startsecs=5
priority=10
stdout_logfile=/logs/artemis/artemis.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=3
stderr_logfile=/logs/artemis/artemis-error.log
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=3
; JAVA_ARGS 包含 JMX Remote 參數供 Instana ActiveMQ Artemis sensor 跨 container 連接：
;   -Dcom.sun.management.jmxremote.port=1099       JMX registry port（固定，Instana sensor 預設連接）
;   -Dcom.sun.management.jmxremote.rmi.port=2099   RMI server port（固定，避免 container NAT 隨機分配）
;   -Djava.rmi.server.hostname=0.0.0.0             允許跨 container 連線（Instana agent 在 10.89.2.5）
;   -Dcom.sun.management.jmxremote.ssl=false       demo 環境關閉 TLS
;   -Dcom.sun.management.jmxremote.authenticate=false  demo 環境關閉認證
environment=JAVA_HOME="/opt/java/openjdk",ARTEMIS_INSTANCE="/var/lib/artemis-broker",JAVA_ARGS="-Xms128M -Xmx256M -XX:+UseSerialGC -Dlog4j2.disableJmx=true -Dcom.sun.management.jmxremote=true -Dcom.sun.management.jmxremote.port=1099 -Dcom.sun.management.jmxremote.rmi.port=2099 -Djava.rmi.server.hostname=0.0.0.0 -Dcom.sun.management.jmxremote.ssl=false -Dcom.sun.management.jmxremote.authenticate=false"

; ─── WAS Liberty Application Server ──────────────────────────────────────
; priority=20：等待 MQ 就緒後啟動
[program:liberty]
; OpenJ9/Semeru + Liberty 正確做法：
;   JVM_ARGS：Liberty server script 直接拼入 java 命令列，不會被 Liberty 重寫
;   IBM_JAVA_OPTIONS：只放 OpenJ9 旗標（-Xshareclasses:none），避免 Liberty script
;                     在 run action 前把整個值換成 SERVER_IBM_JAVA_OPTIONS
;   -javaagent 必須放在 JVM_ARGS，不能放在 IBM_JAVA_OPTIONS
command=/opt/ibm/wlp/bin/server run defaultServer
shell=true
autostart=true
autorestart=true
startsecs=10
priority=20
stdout_logfile=/logs/liberty/console.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=3
stderr_logfile=/logs/liberty/error.log
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=3
environment=WLP_LOGGING_CONSOLE_FORMAT="json",WLP_LOGGING_CONSOLE_LOGLEVEL="info",LOG_DIR="/logs/liberty",IBM_JAVA_OPTIONS="-Xshareclasses:none",JVM_ARGS=""
