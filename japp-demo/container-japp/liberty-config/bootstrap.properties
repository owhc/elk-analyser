# WAS Liberty bootstrap.properties — Banking Demo
#
# 此檔案在 Liberty 最早期的啟動階段被讀取，優先於 server.xml。
# 作用：將環境變數橋接為 server.xml 可讀取的屬性 (${mq.host} 等)。
#
# 語法：
#   - Liberty 讀取 OS 環境變數：${env.VAR_NAME}
#   - server.xml 引用本檔屬性：${property.key} 或簡寫 ${key}
#
# 使用方式：
#   podman-compose.yml 中，此檔案 volume mount 至：
#   /opt/ibm/wlp/usr/servers/defaultServer/bootstrap.properties

# ===========================================================
# ActiveMQ Artemis（MQ Light 相容 broker）連線設定
# ===========================================================
# MQ broker 主機（同容器內為 localhost）
mq.host=localhost

# AMQP 協議端口
mq.port=5672

# MQ 認證帳號（demo 硬編碼）
mq.user=admin

# MQ 認證密碼（demo 硬編碼）
mq.pass=admin123

# JmsConfig @Value 用的 broker URL（CORE 協議，port 61616）
mq.broker-url=tcp://localhost:61616

# ===========================================================
# PostgreSQL 資料庫連線設定
# ===========================================================
# PostgreSQL 主機（podman-compose service 名稱 banking-db）
db.host=banking-db

# PostgreSQL 端口（容器內 5432）
db.port=5432

# 資料庫名稱
db.name=bankdb

# 帳號
db.user=db2inst1

# 密碼
db.pass=db2admin123

# ===========================================================
# Liberty 日誌設定
# ===========================================================
# 日誌輸出目錄（掛載至 app_logs 共享 volume）
com.ibm.ws.logging.log.directory=/logs/liberty

# 最大保留日誌檔案數
com.ibm.ws.logging.max.files=5

# 單一日誌檔案大小上限（MB）
com.ibm.ws.logging.max.file.size=20

# Console 輸出格式（json 供 container runtime 或 Logstash 收集）
WLP_LOGGING_CONSOLE_FORMAT=json

# Console 日誌級別
WLP_LOGGING_CONSOLE_LOGLEVEL=info

# messages.log 輸出格式
WLP_LOGGING_MESSAGE_FORMAT=json

# 訊息來源（message、trace、accessLog、ffdc、audit）
WLP_LOGGING_MESSAGE_SOURCE=message,accessLog,ffdc

# ===========================================================
# 應用程式設定
# ===========================================================
# 應用程式 context root（對應 banking-app.war）
app.context.root=/banking-app

# ===========================================================
# Liberty WebContainer 修正
# ===========================================================
# Spring Boot ErrorPageFilter 在 Liberty 下造成 POST response body hang。
# 設為 true：Liberty service() 後立即 flush response body，修正此問題。
com.ibm.ws.webcontainer.invokeFlushAfterService=true
