# Updated: 2026-09-15 19:56:07 +0800
# ============================================================
# Spring Boot 3.x — banking-app WAR deployed on WAS Liberty
# ============================================================
#
# NOTE: Server port, DataSource, and JMS ConnectionFactory are
#       all managed by Liberty.  Only Spring MVC / logging config
#       belongs here.

# --- Application Identity ---
spring.application.name=banking-app

# --- MVC Static Resources ---
# Serve HTML/JS from src/main/webapp/static/
spring.mvc.static-path-pattern=/static/**
spring.web.resources.static-locations=classpath:/static/,/WEB-INF/static/

# PostgreSQL is configured via JmsConfig.java
# Do NOT configure spring.jms.* for broker URL — ConnectionFactory is
# created in JmsConfig.java

# --- JMS（直連 ActiveMQ Artemis，CORE 協議 port 61616）---
spring.jms.pub-sub-domain=false
mq.broker-url=tcp://localhost:61616
mq.user=admin
mq.password=admin123

# --- PostgreSQL 直連（Spring DriverManagerDataSource，不透過 Liberty JNDI）---
db.host=banking-db
db.port=5432
db.name=bankdb
db.user=db2inst1
db.pass=db2admin123

# --- Logging ---
logging.level.com.demo.banking=INFO
logging.level.org.springframework.jms=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# --- JSON serialisation ---
# Do not fail on unknown JSON properties coming from MDB replies
spring.jackson.deserialization.fail-on-unknown-properties=false
spring.jackson.serialization.write-dates-as-timestamps=false

# --- Actuator (disabled by default — Liberty provides its own health endpoint) ---
management.endpoints.enabled-by-default=false

# --- Liberty WebContainer Fix ---
# Spring Boot ErrorPageFilter causes POST response body to hang in Liberty.
# Spring Boot will no longer register ErrorPageFilter as a servlet Filter.
spring.mvc.dispatch-options-request=false
server.error.whitelabel.enabled=false
