<!DOCTYPE html>
<!-- Updated: 2026-09-02 16:20:51 +0800 -->
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>帳戶總覽 — 示範銀行</title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          crossorigin="anonymous">
    <style>
        body { background-color: #f0f4f8; }

        .navbar-brand { font-weight: 700; font-size: 1.2rem; }

        .balance-card {
            background: linear-gradient(135deg, #1565c0, #1e88e5);
            color: #fff;
            border-radius: 16px;
        }
        .balance-label { font-size: 0.9rem; opacity: 0.85; }
        .balance-amount { font-size: 2.4rem; font-weight: 700; letter-spacing: 1px; }

        .section-title {
            font-size: 1rem;
            font-weight: 600;
            color: #1565c0;
            border-left: 4px solid #1565c0;
            padding-left: 0.6rem;
            margin-bottom: 1rem;
        }

        .tx-table th { font-size: 0.82rem; color: #6c757d; }
        .tx-table td { font-size: 0.9rem; vertical-align: middle; }

        .badge-completed   { background-color: #e8f5e9; color: #2e7d32; }
        .badge-pending     { background-color: #fff8e1; color: #f57f17; }
        .amount-in  { color: #2e7d32; font-weight: 600; }
        .amount-out { color: #c62828; font-weight: 600; }

        #loadingSpinner { display: none; }
        #dashboardContent { display: none; }
    </style>
</head>
<body>

<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark" style="background-color: #1565c0;">
    <div class="container">
        <span class="navbar-brand">🏦 示範銀行</span>
        <div class="ms-auto d-flex align-items-center gap-3">
            <span class="text-white small" id="navOwnerName"></span>
            <button class="btn btn-outline-light btn-sm" onclick="doLogout()">登出</button>
        </div>
    </div>
</nav>

<!-- Main Content -->
<div class="container py-4">

    <!-- Loading -->
    <div class="text-center py-5" id="loadingSpinner">
        <div class="spinner-border text-primary" role="status"></div>
        <p class="mt-3 text-muted">載入帳戶資料中…</p>
    </div>

    <!-- Error -->
    <div class="alert alert-warning d-none" id="errorBanner" role="alert">
        ⚠ 無法從伺服器取得最新資料，目前顯示快取資料。
    </div>

    <!-- Dashboard Content -->
    <div id="dashboardContent">

        <!-- Balance Card -->
        <div class="balance-card p-4 mb-4">
            <div class="row align-items-center">
                <div class="col">
                    <p class="balance-label mb-1">帳號：<span id="cardAccountId"></span></p>
                    <p class="balance-label mb-2">戶名：<span id="cardOwnerName"></span></p>
                    <p class="balance-label mb-1">活期存款餘額</p>
                    <p class="balance-amount mb-0">NT$ <span id="cardBalance">—</span></p>
                </div>
                <div class="col-auto">
                    <a href="transfer.html" class="btn btn-light btn-lg fw-semibold px-4">
                        立即轉帳
                    </a>
                </div>
            </div>
        </div>

        <!-- Recent Transactions -->
        <div class="card shadow-sm">
            <div class="card-body">
                <p class="section-title">最近交易記錄</p>
                <div class="table-responsive">
                    <table class="table tx-table table-hover mb-0">
                        <thead>
                            <tr>
                                <th>交易時間</th>
                                <th>交易類型</th>
                                <th>對象帳號</th>
                                <th class="text-end">金額 (NT$)</th>
                                <th>狀態</th>
                                <th>備註</th>
                            </tr>
                        </thead>
                        <tbody id="txTableBody">
                            <tr>
                                <td colspan="6" class="text-center text-muted py-4">查無交易記錄</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

    </div><!-- /dashboardContent -->
</div>

<script src="app.js"></script>
<script>
    // Guard: require login
    requireAuth();

    const accountId = sessionStorage.getItem('accountId');
    const ownerName = sessionStorage.getItem('ownerName');

    document.getElementById('navOwnerName').textContent = ownerName || '';
    document.getElementById('cardAccountId').textContent = accountId || '';
    document.getElementById('cardOwnerName').textContent  = ownerName || '';

    const spinner  = document.getElementById('loadingSpinner');
    const content  = document.getElementById('dashboardContent');
    const errorBan = document.getElementById('errorBanner');

    // Fetch account data on page load
    (async () => {
        spinner.style.display = 'block';
        try {
            const resp = await apiGet(`/api/accounts/${accountId}`);
            if (resp.success && resp.data) {
                renderDashboard(resp.data);
            } else {
                errorBan.classList.remove('d-none');
                renderDashboard(null);
            }
        } catch (err) {
            console.error('Dashboard load error:', err);
            errorBan.classList.remove('d-none');
            renderDashboard(null);
        } finally {
            spinner.style.display = 'none';
            content.style.display = 'block';
        }
    })();

    function renderDashboard(data) {
        if (!data) {
            document.getElementById('cardBalance').textContent = '0.00';
            return;
        }
        document.getElementById('cardBalance').textContent = formatAmount(data.balance);

        const tbody = document.getElementById('txTableBody');
        const txs = data.recentTransactions || [];
        if (txs.length === 0) {
            tbody.innerHTML = '<tr><td colspan="6" class="text-center text-muted py-4">查無交易記錄</td></tr>';
            return;
        }

        tbody.innerHTML = txs.map(tx => {
            const isIncoming  = tx.toAccount === accountId;
            const counterpart = isIncoming ? tx.fromAccount : tx.toAccount;
            const txType      = isIncoming ? '轉入' : '轉出';
            const amountCls   = isIncoming ? 'amount-in' : 'amount-out';
            const amountSign  = isIncoming ? '+' : '-';
            const badgeCls    = tx.status === '已完成' ? 'badge-completed' : 'badge-pending';

            return `
            <tr>
                <td>${formatDateTime(tx.txTime)}</td>
                <td>${txType}</td>
                <td><code>${counterpart || '—'}</code></td>
                <td class="text-end ${amountCls}">${amountSign}${formatAmount(tx.amount)}</td>
                <td><span class="badge ${badgeCls}">${tx.status || '—'}</span></td>
                <td class="text-muted">${tx.description || '—'}</td>
            </tr>`;
        }).join('');
    }

    async function doLogout() {
        try { await apiPost('/api/logout', {}); } catch (_) {}
        sessionStorage.clear();
        window.location.href = 'login.html';
    }
</script>
</body>
</html>
