<!DOCTYPE html>
<!-- Updated: 2026-09-02 16:20:51 +0800 -->
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>銀行示範系統 — 登入</title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          crossorigin="anonymous">
    <style>
        body {
            background: linear-gradient(135deg, #1a237e 0%, #0d47a1 60%, #1565c0 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-card {
            width: 100%;
            max-width: 420px;
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }
        .bank-logo {
            font-size: 2.5rem;
            color: #1565c0;
        }
        .btn-login {
            background-color: #1565c0;
            border-color: #1565c0;
            font-size: 1.05rem;
            padding: 0.6rem;
        }
        .btn-login:hover {
            background-color: #0d47a1;
            border-color: #0d47a1;
        }
        .hint-text {
            font-size: 0.82rem;
            color: #6c757d;
        }
        #errorMsg {
            display: none;
        }
    </style>
</head>
<body>
<div class="card login-card p-4">
    <div class="text-center mb-4">
        <div class="bank-logo">🏦</div>
        <h1 class="h4 fw-bold mt-2 mb-0" style="color:#1565c0;">示範銀行</h1>
        <p class="text-muted mb-0" style="font-size:0.9rem;">網路銀行服務</p>
    </div>

    <div class="alert alert-danger small" id="errorMsg" role="alert">
        帳號或密碼錯誤，請重新輸入。
    </div>

    <form id="loginForm" novalidate>
        <div class="mb-3">
            <label for="username" class="form-label fw-semibold">帳號</label>
            <input type="text" class="form-control form-control-lg" id="username"
                   name="username" placeholder="請輸入帳號"
                   autocomplete="username" required>
        </div>
        <div class="mb-4">
            <label for="password" class="form-label fw-semibold">密碼</label>
            <input type="password" class="form-control form-control-lg" id="password"
                   name="password" placeholder="請輸入密碼"
                   autocomplete="current-password" required>
        </div>
        <button type="submit" class="btn btn-primary btn-login w-100 text-white" id="loginBtn">
            登&nbsp;&nbsp;入
        </button>
    </form>

    <hr class="my-3">
    <div class="hint-text text-center">
        <p class="mb-1">示範帳號（測試用）：</p>
        <p class="mb-0">user001 / pass001 &nbsp;|&nbsp; user002 / pass002 &nbsp;|&nbsp; user003 / pass003</p>
    </div>
</div>

<script src="app.js"></script>
<script>
    const form     = document.getElementById('loginForm');
    const errorMsg = document.getElementById('errorMsg');
    const loginBtn = document.getElementById('loginBtn');

    form.addEventListener('submit', async (e) => {
        e.preventDefault();
        errorMsg.style.display = 'none';
        loginBtn.disabled = true;
        loginBtn.textContent = '登入中…';

        const username = document.getElementById('username').value.trim();
        const password = document.getElementById('password').value;

        try {
            const resp = await apiPost('/api/login', { username, password });
            if (resp.success && resp.data) {
                // Persist login state in sessionStorage
                sessionStorage.setItem('accountId', resp.data.accountId);
                sessionStorage.setItem('ownerName', resp.data.ownerName);
                window.location.href = 'dashboard.html';
            } else {
                errorMsg.textContent = resp.message || '帳號或密碼錯誤，請重新輸入。';
                errorMsg.style.display = 'block';
            }
        } catch (err) {
            errorMsg.textContent = '連線失敗，請稍後再試。';
            errorMsg.style.display = 'block';
            console.error('Login error:', err);
        } finally {
            loginBtn.disabled = false;
            loginBtn.textContent = '登　　入';
        }
    });
</script>
</body>
</html>
