<!DOCTYPE html>
<!-- Updated: 2026-09-02 16:20:51 +0800 -->
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>轉帳申請 — 示範銀行</title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          crossorigin="anonymous">
    <style>
        body { background-color: #f0f4f8; }
        .navbar-brand { font-weight: 700; font-size: 1.2rem; }

        .form-card {
            max-width: 600px;
            margin: 0 auto;
        }
        .section-title {
            font-size: 1rem;
            font-weight: 600;
            color: #1565c0;
            border-left: 4px solid #1565c0;
            padding-left: 0.6rem;
            margin-bottom: 1.2rem;
        }
        .btn-transfer {
            background-color: #1565c0;
            border-color: #1565c0;
            font-size: 1rem;
            padding: 0.6rem 2rem;
        }
        .btn-transfer:hover {
            background-color: #0d47a1;
            border-color: #0d47a1;
        }
        #successMsg, #errorMsg { display: none; }
    </style>
</head>
<body>

<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark" style="background-color: #1565c0;">
    <div class="container">
        <a class="navbar-brand" href="dashboard.html">🏦 示範銀行</a>
        <div class="ms-auto d-flex align-items-center gap-3">
            <span class="text-white small" id="navOwnerName"></span>
            <button class="btn btn-outline-light btn-sm" onclick="doLogout()">登出</button>
        </div>
    </div>
</nav>

<!-- Main Content -->
<div class="container py-4">
    <div class="form-card">

        <!-- Breadcrumb -->
        <nav aria-label="breadcrumb" class="mb-3">
            <ol class="breadcrumb">
                <li class="breadcrumb-item">
                    <a href="dashboard.html" class="text-decoration-none">帳戶總覽</a>
                </li>
                <li class="breadcrumb-item active" aria-current="page">轉帳申請</li>
            </ol>
        </nav>

        <div class="card shadow-sm">
            <div class="card-body p-4">
                <p class="section-title">網路轉帳</p>

                <!-- Success Message -->
                <div class="alert alert-success" id="successMsg" role="alert">
                    <strong>✅ 轉帳申請已送出！</strong>
                    <p class="mb-0 mt-1" id="successDetail"></p>
                    <div class="mt-3">
                        <a href="dashboard.html" class="btn btn-success btn-sm">返回帳戶總覽</a>
                    </div>
                </div>

                <!-- Error Message -->
                <div class="alert alert-danger" id="errorMsg" role="alert">
                    <span id="errorDetail"></span>
                </div>

                <!-- Transfer Form -->
                <form id="transferForm" novalidate>

                    <div class="mb-3">
                        <label for="fromAccount" class="form-label fw-semibold">來源帳號</label>
                        <input type="text" class="form-control bg-light" id="fromAccount"
                               name="fromAccount" readonly>
                        <div class="form-text">此帳號為您目前登入的帳號</div>
                    </div>

                    <div class="mb-3">
                        <label for="toAccount" class="form-label fw-semibold">
                            目標帳號 <span class="text-danger">*</span>
                        </label>
                        <select class="form-select" id="toAccount" name="toAccount" required>
                            <option value="">— 請選擇目標帳號 —</option>
                            <option value="ACC001">ACC001（王大明）</option>
                            <option value="ACC002">ACC002（李小美）</option>
                            <option value="ACC003">ACC003（張志偉）</option>
                        </select>
                        <div class="invalid-feedback">請選擇轉帳目標帳號。</div>
                    </div>

                    <div class="mb-3">
                        <label for="amount" class="form-label fw-semibold">
                            轉帳金額 (NT$) <span class="text-danger">*</span>
                        </label>
                        <input type="number" class="form-control" id="amount"
                               name="amount" min="1" step="1" placeholder="例：1000"
                               required>
                        <div class="invalid-feedback">請輸入有效的轉帳金額（必須大於零）。</div>
                    </div>

                    <div class="mb-4">
                        <label for="description" class="form-label fw-semibold">備註說明</label>
                        <input type="text" class="form-control" id="description"
                               name="description" maxlength="100"
                               placeholder="例：餐費分攤（選填）">
                    </div>

                    <div class="d-flex gap-3">
                        <button type="submit" class="btn btn-primary btn-transfer text-white"
                                id="submitBtn">
                            確認轉帳
                        </button>
                        <a href="dashboard.html" class="btn btn-outline-secondary">取消</a>
                    </div>

                </form>
            </div>
        </div>

    </div><!-- /form-card -->
</div>

<script src="app.js"></script>
<script>
    // Guard: require login
    requireAuth();

    const accountId = sessionStorage.getItem('accountId');
    const ownerName = sessionStorage.getItem('ownerName');

    document.getElementById('navOwnerName').textContent = ownerName || '';
    document.getElementById('fromAccount').value = accountId || '';

    // Remove the logged-in account from the target dropdown
    const toSelect = document.getElementById('toAccount');
    Array.from(toSelect.options).forEach(opt => {
        if (opt.value === accountId) opt.remove();
    });

    const form       = document.getElementById('transferForm');
    const successMsg = document.getElementById('successMsg');
    const errorMsg   = document.getElementById('errorMsg');
    const submitBtn  = document.getElementById('submitBtn');

    form.addEventListener('submit', async (e) => {
        e.preventDefault();
        errorMsg.style.display  = 'none';
        successMsg.style.display = 'none';

        if (!form.checkValidity()) {
            form.classList.add('was-validated');
            return;
        }

        const toAccount   = document.getElementById('toAccount').value;
        const amount      = parseFloat(document.getElementById('amount').value);
        const description = document.getElementById('description').value.trim();

        if (toAccount === accountId) {
            showError('來源帳號與目標帳號不可相同。');
            return;
        }
        if (isNaN(amount) || amount <= 0) {
            showError('請輸入有效的轉帳金額。');
            return;
        }

        submitBtn.disabled = true;
        submitBtn.textContent = '處理中…';

        try {
            const resp = await apiPost('/api/transfer', {
                fromAccount: accountId,
                toAccount,
                amount,
                description
            });

            if (resp.success) {
                form.style.display = 'none';
                document.getElementById('successDetail').textContent =
                    `轉出 NT$ ${formatAmount(amount)} 至帳號 ${toAccount}。${resp.message || ''}`;
                successMsg.style.display = 'block';
            } else {
                showError(resp.message || '轉帳失敗，請稍後再試。');
            }
        } catch (err) {
            console.error('Transfer error:', err);
            showError('連線失敗，請稍後再試。');
        } finally {
            submitBtn.disabled = false;
            submitBtn.textContent = '確認轉帳';
        }
    });

    function showError(msg) {
        document.getElementById('errorDetail').textContent = msg;
        errorMsg.style.display = 'block';
    }

    async function doLogout() {
        try { await apiPost('/api/logout', {}); } catch (_) {}
        sessionStorage.clear();
        window.location.href = 'login.html';
    }
</script>
</body>
</html>
