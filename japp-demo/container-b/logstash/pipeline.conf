# Logstash Pipeline - Banking Demo
# Updated: 2026-09-17 14:19:18 +0800
#
# 日誌來源：
#   /logs/liberty/   — WAS Liberty JSON 格式日誌（messages.log, trace.log）
#   /logs/artemis/   — ActiveMQ Artemis Log4j 格式日誌
#   /logs/postgres/  — PostgreSQL server 日誌
#
# 輸出：Elasticsearch banking-logs-{type}-{date} 索引

input {
  # ─────────────────────────────────────────────
  # WAS Liberty JSON logs
  # Liberty 輸出結構化 JSON，每行一個事件
  # ─────────────────────────────────────────────
  file {
    path          => "/logs/liberty/*.log"
    type          => "liberty"
    codec         => "json"
    start_position => "beginning"
    sincedb_path  => "/usr/share/logstash/data/sincedb_liberty"
    tags          => ["liberty", "was"]
  }

  # ─────────────────────────────────────────────
  # ActiveMQ Artemis logs (Log4j pattern)
  # 格式：YYYY-MM-DD HH:mm:ss,SSS LEVEL [logger] message
  # ─────────────────────────────────────────────
  file {
    path          => "/logs/artemis/*.log"
    type          => "artemis"
    codec         => "plain"
    start_position => "beginning"
    sincedb_path  => "/usr/share/logstash/data/sincedb_artemis"
    tags          => ["artemis", "mq"]
  }

  # ─────────────────────────────────────────────
  # PostgreSQL server 日誌
  # ─────────────────────────────────────────────
  file {
    path          => ["/logs/postgres/*.log", "/logs/db2/*.log"]
    type          => "postgres"
    codec         => "plain"
    start_position => "beginning"
    sincedb_path  => "/usr/share/logstash/data/sincedb_postgres"
    tags          => ["postgres", "postgresql"]
  }
}

filter {
  # ─────────────────────────────────────────────
  # 共通 metadata 欄位
  # ─────────────────────────────────────────────
  mutate {
    add_field => {
      "container"   => "banking-app"
      "environment" => "demo"
    }
  }

  # ─────────────────────────────────────────────
  # WAS Liberty：JSON 已解析，補充業務 metadata
  # Liberty JSON 欄位：ibm_datetime, ibm_sequence,
  #   loglevel, ibm_threadId, module, message, etc.
  # ─────────────────────────────────────────────
  if [type] == "liberty" or [type] == "liberty_message" {
    mutate {
      add_field => {
        "service"  => "was-liberty"
        "log_type" => "application"
      }
      # 統一 loglevel → log.level（liberty 與 liberty_message 兩種 type 皆適用）
      rename => { "loglevel" => "[log][level]" }
    }

    # Liberty 非標準 level 值正規化 → 統一為 ERROR / WARN / INFO / DEBUG
    # SystemErr = stderr 輸出，通常是例外堆疊，視為 ERROR
    # SystemOut = stdout 輸出，視為 INFO
    # WARNING   = Liberty 拼法，對齊為 WARN
    # AUDIT     = 審計日誌，視為 INFO
    if [log][level] == "SystemErr" {
      mutate { update => { "[log][level]" => "ERROR" } }
    } else if [log][level] == "SystemOut" {
      mutate { update => { "[log][level]" => "INFO" } }
    } else if [log][level] == "WARNING" {
      mutate { update => { "[log][level]" => "WARN" } }
    } else if [log][level] == "AUDIT" {
      mutate { update => { "[log][level]" => "INFO" } }
    }

    # Liberty JSON 時間欄位為 ibm_datetime：2024-01-15T10:30:00.000+0800
    date {
      match   => ["ibm_datetime", "yyyy-MM-dd'T'HH:mm:ss.SSSZ"]
      target  => "@timestamp"
      remove_field => ["ibm_datetime"]
    }

    # 清理 Liberty 特有的低信息量欄位
    mutate {
      remove_field => ["ibm_sequence", "ibm_className", "ibm_methodName"]
    }
  }

  # ─────────────────────────────────────────────
  # ActiveMQ Artemis：grok 解析 Log4j pattern
  # ─────────────────────────────────────────────
  if [type] == "artemis" {
    mutate {
      add_field => {
        "service"  => "activemq-artemis"
        "log_type" => "messaging"
      }
    }

    grok {
      match => {
        "message" => "%{TIMESTAMP_ISO8601:log_time}\s+%{LOGLEVEL:log_level_raw}\s+\[%{DATA:logger}\]\s+%{GREEDYDATA:log_message}"
      }
      # 若 grok 失敗，加上 tag 而非丟棄事件
      tag_on_failure => ["_grokparsefailure_artemis"]
    }

    if ![_grokparsefailure_artemis] {
      date {
        match  => ["log_time", "yyyy-MM-dd HH:mm:ss,SSS"]
        target => "@timestamp"
        remove_field => ["log_time"]
      }

      mutate {
        rename     => { "log_level_raw" => "[log][level]" }
        rename     => { "log_message"   => "log_detail" }
        add_field  => { "message" => "%{log_detail}" }
        remove_field => ["log_detail"]
      }
    }
  }

  # ─────────────────────────────────────────────
  # PostgreSQL：解析 logging_collector 輸出的 stderr 日誌
  # 格式：2026-09-03 21:08:22.123 CST [123] user@database ERROR: message
  # ─────────────────────────────────────────────
  if [type] == "postgres" or [type] == "db2" {
    mutate {
      add_field => {
        "service"  => "postgresql"
        "log_type" => "database"
      }
    }

    grok {
      match => {
        "message" => "%{TIMESTAMP_ISO8601:postgres_timestamp}\s+%{DATA:postgres_timezone}\s+\[%{NUMBER:postgres_pid}\]\s+(?:%{DATA:postgres_user}@%{DATA:postgres_database}\s+)?%{LOGLEVEL:postgres_level}:\s+%{GREEDYDATA:postgres_detail}"
      }
      tag_on_failure => ["_grokparsefailure_postgresql"]
    }

    if ![_grokparsefailure_postgresql] {
      date {
        match  => ["postgres_timestamp", "ISO8601"]
        target => "@timestamp"
        remove_field => ["postgres_timestamp"]
      }

      mutate {
        rename    => { "postgres_level"  => "[log][level]" }
        # postgres_detail 包含 check constraint 違反等完整錯誤訊息；
        # 覆寫 message 為解析後的純錯誤描述，
        # 確保 extractor 的 fm["message"] = "message" 能讀到有意義的內容。
        add_field => { "message" => "%{postgres_detail}" }
        remove_field => ["postgres_detail"]
      }
    }
  }

  # ─────────────────────────────────────────────
  # 清理 Logstash 內部欄位（減少 ES 儲存量）
  # ─────────────────────────────────────────────
  mutate {
    remove_field => ["host", "agent", "ecs", "event"]
  }
}

output {
  # ─────────────────────────────────────────────
  # Elasticsearch 輸出
  # 索引命名：banking-logs-{type}-{date}
  #   e.g. banking-logs-liberty-2024.01.15
  #        banking-logs-artemis-2024.01.15
  #        banking-logs-postgres-2024.01.15
  # ─────────────────────────────────────────────
  elasticsearch {
    hosts        => ["http://elasticsearch:9200"]
    index        => "banking-logs-%{type}-%{+YYYY.MM.dd}"
    # ILM 關閉：demo 環境使用日期索引即可
    ilm_enabled  => false
  }

  # Debug 輸出（除錯時取消注解）
  # stdout { codec => rubydebug }
}
